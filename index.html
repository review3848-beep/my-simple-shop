<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Simple Shop</title>

  <style>
    :root{
      --bg:#f7f5ff;
      --panel:#ffffff;
      --border:#e9e3ff;
      --text:#2b235a;
      --muted:#8a7fc7;
      --accent:#a78bfa;
      --accent2:#f5d0fe;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Prompt", system-ui, -apple-system, Segoe UI, Roboto;
      color:var(--text);
      background:
        radial-gradient(900px 400px at 10% -10%, #ede9fe, transparent 60%),
        radial-gradient(900px 400px at 90% 10%, #fce7f3, transparent 60%),
        var(--bg);
    }

    .wrap{max-width:1100px;margin:0 auto;padding:24px}

    header{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:22px
    }

    h1{
      font-size:26px;
      margin:0;
      font-weight:700;
      letter-spacing:.2px;
    }

    .sub{color:var(--muted);font-size:13px}

    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px
    }
    @media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:520px){.grid{grid-template-columns:1fr}}

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(167,139,250,.12);
      transition:.25s ease;
    }
    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 18px 40px rgba(167,139,250,.18);
    }

    .img{
      width:100%;
      height:190px;
      background:#f3f0ff;
      display:block;
      object-fit:cover
    }

    .pad{padding:14px}

    .name{
      font-weight:650;
      font-size:16px;
    }

    .price{
      margin-top:6px;
      color:#7c3aed;
      font-weight:600;
    }

    button{
      cursor:pointer;
      border:0;
      border-radius:14px;
      padding:12px 14px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#3b0764;
      font-weight:700;
      width:100%;
      box-shadow:0 8px 18px rgba(167,139,250,.35);
      transition:.2s ease;
    }
    button:hover{
      filter:brightness(1.05);
      transform:translateY(-1px);
    }
    button:disabled{opacity:.6;cursor:not-allowed}

    .row{display:flex;gap:10px}
    .row > *{flex:1}

    input, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#faf9ff;
      color:var(--text);
      outline:none;
    }

    textarea{min-height:84px;resize:vertical}

    .modalBack{
      position:fixed;
      inset:0;
      background:rgba(120,90,200,.25);
      backdrop-filter: blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px
    }

    .modal{
      max-width:560px;
      width:100%;
      background:#ffffff;
      border:1px solid var(--border);
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 30px 60px rgba(120,90,200,.25);
    }

    .modalHead{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:linear-gradient(135deg,#ede9fe,#fce7f3);
    }

    .x{
      background:transparent;
      color:var(--muted);
      font-size:18px;
      width:auto;
      padding:6px 10px
    }

    .msg{margin-top:10px;font-size:13px;color:var(--muted)}
    .ok{color:#16a34a}
    .bad{color:#dc2626}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>My Simple Shop</h1>
        <div class="sub">เว็บร้านค้าแบบง่าย ขาว-ม่วงพาสเทล</div>
      </div>
      <div class="sub" id="status">กำลังโหลดสินค้า…</div>
    </header>

    <div class="grid" id="grid"></div>
  </div>

  <div class="modalBack" id="modalBack">
    <div class="modal">
      <div class="modalHead">
        <div>
          <div class="name" id="mName">สั่งซื้อ</div>
          <div class="sub" id="mPrice"></div>
        </div>
        <button class="x" id="btnClose">✕</button>
      </div>
      <div class="pad">
        <div class="row">
          <div>
            <div class="sub">ชื่อผู้รับ</div>
            <input id="fName" />
          </div>
          <div>
            <div class="sub">เบอร์โทร</div>
            <input id="fPhone" />
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row">
          <div>
            <div class="sub">จำนวน</div>
            <input id="fQty" type="number" min="1" value="1" />
          </div>
          <div>
            <div class="sub">หมายเหตุ</div>
            <input id="fNote" />
          </div>
        </div>

        <div style="height:10px"></div>

        <div>
          <div class="sub">ที่อยู่จัดส่ง</div>
          <textarea id="fAddress"></textarea>
        </div>

        <div style="height:12px"></div>
        <button id="btnSubmit">ยืนยันสั่งซื้อ</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwPExSc4fYjJlAwzHdf02CRrMiFjOMU9aPUy3wSDWhoAmV0roCxKXIyk9rh7SY8XL8EHg/exec";

  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");

  const modalBack = document.getElementById("modalBack");
  const btnClose = document.getElementById("btnClose");
  const btnSubmit = document.getElementById("btnSubmit");
  const msgEl = document.getElementById("msg");

  const mName = document.getElementById("mName");
  const mPrice = document.getElementById("mPrice");
  const fName = document.getElementById("fName");
  const fPhone = document.getElementById("fPhone");
  const fQty = document.getElementById("fQty");
  const fAddress = document.getElementById("fAddress");
  const fNote = document.getElementById("fNote");

  let selected = null;

  init();

  async function init(){
    try{
      const url = API_URL + "?action=listProducts";
      const res = await fetch(url);
      const json = await res.json();
      if(!json.ok) throw new Error(json.error || "โหลดสินค้าไม่สำเร็จ");

      renderProducts(json.data || []);
      statusEl.textContent = "พร้อมขายแล้ว 💜";
    }catch(err){
      statusEl.textContent = "โหลดไม่ได้ ❌";
      grid.innerHTML = `<div class="sub">Error: ${String(err)}</div>`;
    }
  }

  function renderProducts(items){
    if(!items.length){
      grid.innerHTML = `<div class="sub">ยังไม่มีสินค้า</div>`;
      return;
    }
    grid.innerHTML = items.map(p => `
      <div class="card">
        <img class="img" src="${p.img || ''}" onerror="this.style.display='none'" />
        <div class="pad">
          <div class="name">${p.name}</div>
          <div class="price">฿${Number(p.price||0).toLocaleString()}</div>
          <div style="height:10px"></div>
          <button onclick='openBuy(${JSON.stringify(p)})'>สั่งซื้อ</button>
        </div>
      </div>
    `).join("");
  }

  window.openBuy = (p) => {
    selected = p;
    msgEl.textContent = "";
    mName.textContent = "สั่งซื้อ: " + p.name;
    mPrice.textContent = "ราคา: ฿" + Number(p.price||0).toLocaleString();
    modalBack.style.display = "flex";
  };

  btnClose.onclick = () => modalBack.style.display = "none";
  modalBack.onclick = e => { if(e.target===modalBack) modalBack.style.display="none"; };

  btnSubmit.onclick = async () => {
    if(!selected) return;
    const payload = {
      action: "createOrder",
      productId: selected.id,
      qty: Number(fQty.value||1),
      customerName: fName.value,
      phone: fPhone.value,
      address: fAddress.value,
      note: fNote.value
    };

    if(!payload.customerName || !payload.phone || !payload.address){
      msgEl.textContent = "กรอกข้อมูลให้ครบ";
      msgEl.className = "msg bad";
      return;
    }

    btnSubmit.disabled = true;
    msgEl.textContent = "กำลังบันทึก…";

    try{
      const res = await fetch(API_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if(!json.ok) throw new Error(json.error);
      msgEl.textContent = "สำเร็จ! เลขออเดอร์ " + json.data.orderId;
      msgEl.className = "msg ok";
    }catch(err){
      msgEl.textContent = "พลาด: " + err;
      msgEl.className = "msg bad";
    }finally{
      btnSubmit.disabled = false;
    }
  };
</script>
</body>
</html>
